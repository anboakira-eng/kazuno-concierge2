    function App() {
      const [tab, setTab] = useState("chat");
      const [messages, setMessages] = useState([
        { role: "assistant", content: "こんにちは！鹿角観光コンシェルジェ「かづのナビ」です。\nたんぽ小町ちゃんとかぶきんが、道の駅かづの あんとらあ を拠点に鹿角の旅をご案内します🍢\n何を知りたいですか？" },
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const scrollRef = useRef(null);

      useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
      }, [messages, loading]);

      async function send(text) {
        const content = (text ?? input).trim();
        if (!content || loading) return;
        const next = [...messages, { role: "user", content }];
        setMessages(next);
        setInput("");
        setLoading(true);
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: next.map((m) => ({ role: m.role, content: m.content })) }),
          });
          const data = await res.json();
          const reply = data.reply || data.error || "うまく応答できませんでした。";
          setMessages((m) => [...m, { role: "assistant", content: reply }]);
        } catch (e) {
          setMessages((m) => [...m, { role: "assistant", content: "接続に問題が発生しました。少し時間をおいてお試しください。" }]);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div style={{ maxWidth: 430, width: "100%", minHeight: "100vh", background: "#8CC0DE", display: "flex", flexDirection: "column", position: "relative", overflow: "hidden" }}>
          <div style={{ background: "#06283D", color: "#fff", padding: "12px 16px", display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
            <div style={{ display: "flex", alignItems: "flex-end" }}>
              <img src={TANPO} alt="たんぽ小町ちゃん" style={{ width: 40, height: 40, borderRadius: "50%", background: "#fff", objectFit: "cover", border: "2px solid #fff" }} />
              <img src={KABUKIN} alt="かぶきん" style={{ width: 40, height: 40, borderRadius: "50%", background: "#fff", objectFit: "cover", border: "2px solid #fff", marginLeft: -10 }} />
            </div>
            <div style={{ lineHeight: 1.2 }}>
              <div style={{ fontWeight: 700, fontSize: 16 }}>かづのナビ</div>
              <div style={{ fontSize: 11, opacity: .7 }}>道の駅かづの あんとらあ 公式</div>
            </div>
          </div>

          {tab === "chat" && (
            <React.Fragment>
              <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: 16 }}>
                {messages.map((m, i) => <Bubble key={i} role={m.role} content={m.content} />)}
                {loading && <Bubble role="assistant" content="" typing />}
                {messages.length <= 2 && !loading && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8 }}>
                    {QUICK.map((q) => (
                      <button key={q} onClick={() => send(q)} style={{ background: "#fff", border: "1px solid #06283D22", color: "#06283D", borderRadius: 16, padding: "7px 12px", fontSize: 12.5 }}>{q}</button>
                    ))}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 8, padding: 10, background: "#fff", borderTop: "1px solid #eee", flexShrink: 0 }}>
                <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="鹿角の旅について聞いてみる…" style={{ flex: 1, border: "1px solid #ddd", borderRadius: 20, padding: "10px 14px", fontSize: 16 }} />
                <button onClick={() => send()} disabled={loading} style={{ width: 42, height: 42, borderRadius: "50%", background: loading ? "#ccc" : "#06283D", border: "none", color: "#fff", fontSize: 18, flexShrink: 0 }}>➤</button>
              </div>
            </React.Fragment>
          )}

          {tab === "coupons" && <Coupons />}
          {tab === "menu" && <MenuScreen />}

          <div style={{ display: "flex", background: "#fff", borderTop: "1px solid #eee", flexShrink: 0 }}>
            <TabBtn active={tab === "chat"} onClick={() => setTab("chat")} emoji="✨" label="コンシェルジェ" />
            <TabBtn active={tab === "coupons"} onClick={() => setTab("coupons")} emoji="🎫" label="クーポン" />
            <TabBtn active={tab === "menu"} onClick={() => setTab("menu")} emoji="🔍" label="さがす" />
          </div>
        </div>
      );

            </div>
          )}
          <div style={{ maxWidth: me ? "76%" : "72%", background: me ? "#8DE055" : "#fff", color: "#1a1a1a", padding: "9px 12px", borderRadius: 14, fontSize: 14, lineHeight: 1.55, whiteSpace: "pre-wrap", boxShadow: "0 1px 1px rgba(0,0,0,.06)" }}>
            {typing ? <span style={{ opacity: .5 }}>入力中…</span> : content}
          </div>
        </div>
      );
    }

    function Coupons() {
      const items = Object.entries(SPOTS).flatMap(([cat, arr]) => arr.filter((s) => s.coupon).map((s) => ({ ...s, cat })));
      return (
        <div style={{ flex: 1, overflowY: "auto", background: "#F4F6F8", padding: 16 }}>
          <h2 style={{ fontSize: 17, color: "#06283D", margin: "2px 0 4px" }}>加盟店クーポン</h2>
          <p style={{ fontSize: 12, color: "#666", margin: "0 0 14px" }}>受け取り・利用はLINE公式アカウントで。ボタンからLINEに移動します。</p>
          {items.map((c, i) => (
            <div key={i} style={{ background: "#fff", borderRadius: 14, padding: 14, marginBottom: 12, boxShadow: "0 1px 3px rgba(0,0,0,.06)" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14.5, color: "#1a1a1a" }}>{c.name}</div>
                  <div style={{ fontSize: 12.5, color: "#666", marginTop: 3 }}>{c.desc}</div>
                </div>
                <div style={{ background: "#E8630A", color: "#fff", fontSize: 11, fontWeight: 700, padding: "3px 8px", borderRadius: 6, whiteSpace: "nowrap" }}>特典あり</div>
              </div>
              <button onClick={() => alert("本番ではLINE公式アカウントのクーポン画面へ遷移します（発行・消し込みはLINE側）")} style={{ marginTop: 12, width: "100%", background: "#06C755", border: "none", color: "#fff", fontWeight: 700, fontSize: 14, padding: "10px", borderRadius: 10 }}>LINEで受け取る</button>
            </div>
          ))}
        </div>
      );
    }

    function MenuScreen() {
      const [open, setOpen] = useState(null);
      if (open) {
        const cat = CATEGORIES.find((c) => c.id === open);
        return (
          <div style={{ flex: 1, overflowY: "auto", background: "#F4F6F8" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "12px 14px", background: "#fff", borderBottom: "1px solid #eee" }}>
              <button onClick={() => setOpen(null)} style={{ background: "none", border: "none", color: "#06283D", fontSize: 18 }}>‹</button>
              <span style={{ fontWeight: 700, color: cat.color }}>{cat.emoji} {cat.label}</span>
            </div>
            <div style={{ padding: 16 }}>
              {SPOTS[open].map((s, i) => (
                <div key={i} style={{ background: "#fff", borderRadius: 12, padding: 13, marginBottom: 10, boxShadow: "0 1px 2px rgba(0,0,0,.05)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 8 }}>
                    <div style={{ fontWeight: 700, fontSize: 14, color: "#1a1a1a" }}>{s.name}</div>
                    {s.coupon && <span style={{ color: "#E8630A", fontSize: 14 }}>🎫</span>}
                  </div>
                  <div style={{ fontSize: 12.5, color: "#666", marginTop: 4 }}>{s.desc}</div>
                </div>
              ))}
            </div>
          </div>
        );
      }
      return (
        <div style={{ flex: 1, overflowY: "auto", background: "#F4F6F8", padding: 16 }}>
          <div style={{ background: "#06283D", color: "#fff", borderRadius: 14, padding: 16, marginBottom: 16 }}>
            <div style={{ fontSize: 12.5, opacity: .8 }}>📍 拠点</div>
            <div style={{ fontWeight: 700, fontSize: 16, marginTop: 4 }}>{HUB.name}</div>
            <div style={{ fontSize: 12, opacity: .85, marginTop: 6, lineHeight: 1.5 }}>{HUB.hours}<br />{HUB.access}</div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            {CATEGORIES.map((c) => (
              <button key={c.id} onClick={() => setOpen(c.id)} style={{ background: "#fff", border: "none", borderRadius: 14, padding: "20px 12px", boxShadow: "0 1px 3px rgba(0,0,0,.06)", display: "flex", flexDirection: "column", alignItems: "center", gap: 8 }}>
                <div style={{ width: 46, height: 46, borderRadius: "50%", background: c.color + "18", display: "grid", placeItems: "center", fontSize: 22 }}>{c.emoji}</div>
                <span style={{ fontWeight: 700, fontSize: 13.5, color: "#333" }}>{c.label}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function TabBtn({ active, onClick, emoji, label }) {
      return (
        <button onClick={onClick} style={{ flex: 1, background: "none", border: "none", padding: "9px 0 8px", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, color: active ? "#E8630A" : "#999" }}>
          <span style={{ fontSize: 20 }}>{emoji}</span>
          <span style={{ fontSize: 10.5, fontWeight: active ? 700 : 500 }}>{label}</span>
        </button>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
